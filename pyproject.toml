# 依存を変更したら uv で requirements.txt を再生成する:
#   kindle_env\Scripts\uv.exe pip compile pyproject.toml -o requirements.txt
# requirements.txt が source of install (setup.bat / pip install -r が読む)、
# pyproject.toml が source of truth (人間が編集する)。

[project]
name = "kindle_shot"
version = "0.1.0"
description = "電子書籍のスクリーンキャプチャ・PDF読込・トリミング・PDF変換・OCR統合ツール (Windows専用)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pyautogui>=0.9.54",
    # NDLOCR-Lite が strict pin で要求する版に揃え、setup 時のダウングレード churn を防ぐ
    # NDLOCR-Lite の requirements.txt が更新されたら以下も追従する
    "opencv-python>=4.11,<4.14",
    "numpy==2.2.2",
    "Pillow==12.1.1",
    "reportlab==4.2.5",
    "pypdfium2==4.30.0",
    "customtkinter>=5.2.2",
]

[dependency-groups]
# CI (.github/workflows/ci.yml) は `pip install --group dev` でこれを入れる。
# lint / format / type check はツールのバージョンで結果が変わるため、
# CI が勝手に赤くならないようメジャー/マイナーの上限を切っておく。
dev = [
    "ruff==0.16.6",  # format ゲートの基準。patch 更新でも整形結果が変わりうるため完全固定
    "uv>=0.11",
    "pytest>=9,<10",
    "mypy>=2.3,<3",
]

# ============================================================
# pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# マーカー名を打ち間違えたら黙って通さずエラーにする
addopts = ["--strict-markers"]
markers = [
    "e2e: CLI をサブプロセスで通しで動かす E2E テスト (pytest -m e2e で単独実行)",
]

# ============================================================
# ruff (lint + format)
# ============================================================

[tool.ruff]
target-version = "py311"
line-length = 100

extend-exclude = [
    "kindle_env",
    "ndlocr-lite",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (line-length is a soft target)
    "E402",  # module level import not at top of file (some scripts need it)
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# mypy (type check)
# ============================================================

[tool.mypy]
python_version = "3.11"
# Windows 専用アプリなので win32 として解析する。これがないと
# ctypes.windll や core/win32_utils.py が「存在しない」と誤検出される。
platform = "win32"
files = ["app.py", "cli.py", "core", "ui", "scripts", "tests"]
exclude = "^(kindle_env|ndlocr-lite)/"
# customtkinter / pyautogui / cv2 などは型スタブを提供していない
ignore_missing_imports = true
# 既存コードは型注釈がほとんど無いため strict は使わない。
# ただし check_untyped_defs は必須。これが false（既定）だと mypy は
# 「引数にも戻り値にも注釈が無い関数」の本体を丸ごとスキップするため、
# このリポジトリでは関数の約 95% が未検査になり、型チェックが名ばかりになる。
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
