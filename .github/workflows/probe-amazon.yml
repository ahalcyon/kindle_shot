# 使い捨ての調査用ワークフロー（#21）。
# 「CI ランナーから Amazon に到達できるか」を認証情報なしで確かめる。
# 判定がついたら削除する。
name: probe-amazon

on:
  workflow_dispatch:
  push:
    branches: [feature/21-headless-e2e]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Probe
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              b = p.chromium.launch(headless=True,
                                    args=["--disable-blink-features=AutomationControlled"])
              page = b.new_page()
              ua = page.evaluate("navigator.userAgent")
              b.close()
              real_ua = ua.replace("HeadlessChrome", "Chrome")

              b = p.chromium.launch(headless=True,
                                    args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(user_agent=real_ua, locale="ja-JP", timezone_id="Asia/Tokyo",
                                  viewport={"width": 1600, "height": 1200})
              page = ctx.new_page()
              r = page.goto("https://read.amazon.co.jp/?asin=B0BVLM8RR2",
                            wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(6000)
              print("status      :", r.status if r else None)
              print("url         :", page.url[:120])
              print("title       :", page.title()[:120])
              print("webdriver   :", page.evaluate("navigator.webdriver"))
              body = page.inner_text("body")[:400].replace("\n", " | ")
              print("body        :", body)
              for sel in ("#ap_email", "#ap_email_login", "input[type=email]",
                          "#auth-captcha-guess", "form[name=signIn]"):
                  print(f"  {sel:24} count={page.locator(sel).count()}")
              b.close()
          PY
