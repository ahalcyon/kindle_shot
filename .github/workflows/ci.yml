# kindle_shot CI
#
# ユニットテストと E2E は windows-latest で走らせる。このアプリは Windows 専用で、
# core/win32_utils.py (ctypes.windll) や Windows の日本語フォント検出に依存する
# テストが Linux では成立しないため。
# lint / format / type check は OS 非依存なので ubuntu で先に速く回す
# (mypy は pyproject.toml で platform = "win32" を指定しているため、
#  Linux 上でも Windows 前提で解析される)。
#
# Python はローカル開発環境と同じ 3.12 に固定する。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同じブランチへ続けて push したら古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master へ入ったコミットの CI は握り潰さない
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # 日本語のファイル名・パス・標準出力が cp932 で壊れないようにする
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: lint / format / type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        # --group dev は pip 25.1 以降の機能なので先に pip を上げる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: 改行コードの正規化が破れていないか (.gitattributes)
        shell: bash
        run: git diff --exit-code

      - name: Lint (ruff check)
        shell: bash
        run: ruff check .

      - name: Format (ruff format --check)
        shell: bash
        run: ruff format --check .

      - name: Type check (mypy)
        shell: bash
        run: mypy

  test:
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: Unit tests
        shell: bash
        run: pytest -m "not e2e" -q

  e2e:
    name: e2e tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    # ユニットテストが通らないうちに E2E を回しても切り分けの助けにならない
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: E2E tests
        shell: bash
        run: pytest -m e2e -q
