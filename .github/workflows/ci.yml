# kindle_shot CI
#
# ユニットテストと E2E は windows-latest で走らせる。このアプリは Windows 専用で、
# core/win32_utils.py (ctypes.windll) や Windows の日本語フォント検出に依存する
# テストが Linux では成立しないため。
# lint / format / type check は OS 非依存なので ubuntu で先に速く回す
# (mypy は pyproject.toml で platform = "win32" を指定しているため、
#  Linux 上でも Windows 前提で解析される)。
#
# Python は setup.bat が既定で入れる 3.13 に固定する。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同じブランチへ続けて push したら古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master へ入ったコミットの CI は握り潰さない
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # 日本語のファイル名・パス・標準出力が cp932 で壊れないようにする
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  quality:
    name: lint / format / type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        # --group dev は pip 25.1 以降の機能なので先に pip を上げる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: 改行コードの正規化が破れていないか (.gitattributes)
        shell: bash
        run: git diff --exit-code

      - name: Lint (ruff check)
        shell: bash
        run: ruff check .

      - name: Format (ruff format --check)
        shell: bash
        run: ruff format --check .

      - name: Type check (mypy)
        shell: bash
        run: mypy

  test:
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      - name: Unit tests
        shell: bash
        run: pytest -m "not e2e" -q

  e2e:
    name: e2e tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    # ユニットテストが通らないうちに E2E を回しても切り分けの助けにならない
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --group dev

      # 対象ファイルを明示する。-m e2e だけだと実 Amazon 用のテストも拾い、
      # 資格情報が無いので skip されて「緑だが何も試していない」状態になる。
      - name: E2E tests
        shell: bash
        run: pytest tests/e2e/test_cli_pipeline_e2e.py -m e2e -q

  # 実 Amazon に対する E2E。self-hosted runner で回す。
  #
  # headless 経路は Kindle Cloud Reader の DOM に依存するため、偽のページで
  # 代替すると Amazon 側の構造変化を検知できない。ここだけは本物に当てる。
  #
  # self-hosted にするのは、GitHub ホストのランナーだと新しい IP からの初回
  # ログインで追加認証が入りうるため（サインインページへの到達自体は
  # 実測で確認済み: status 200 / CAPTCHA 無し）。
  #
  # 毎回セッションを消してサインインから通す。ランナーが変わればセッションは
  # 無く、期限切れも起きるため、自動ログインこそ守るべき経路になる。
  amazon-e2e:
    name: e2e tests (real Amazon, self-hosted)
    runs-on: [self-hosted, windows]
    timeout-minutes: 45
    # ランナーが登録されていないリポジトリでも CI 全体が止まらないようにする
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # self-hosted の Windows では shell: bash が WSL の
      # C:\WINDOWS\system32\bash.EXE に解決され、Windows パスの一時スクリプトを
      # 実行できない（GitHub ホストは Git Bash なので起きない）。cmd を使う。
      - name: Install dependencies
        shell: cmd
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install --group dev && pip install playwright && playwright install chromium

      - name: E2E against Amazon
        shell: cmd
        env:
          KINDLE_SHOT_AMAZON_EMAIL: ${{ secrets.KINDLE_SHOT_AMAZON_EMAIL }}
          KINDLE_SHOT_AMAZON_PASSWORD: ${{ secrets.KINDLE_SHOT_AMAZON_PASSWORD }}
          KINDLE_SHOT_E2E_ASIN: ${{ vars.KINDLE_SHOT_E2E_ASIN }}
        run: pytest tests/e2e/test_amazon_e2e.py -m e2e -q
