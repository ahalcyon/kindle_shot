<!doctype html>
<meta charset="utf-8">
<title>Kindle</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  .top-chrome { position: fixed; top: 0; left: 0; right: 0; height: 60px;
                background: #eee; border-bottom: 1px solid #ccc; }
  ion-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
               display: block; background: #eee; }
  #kr-scrubber-bar { position: fixed; bottom: 44px; left: 0; right: 0; height: 40px;
                     display: block; background: #ddd; }
  .kr-chevron-container-left, .kr-chevron-container-right {
      position: fixed; top: 0; bottom: 0; width: 160px; background: rgba(0,0,0,.06); }
  .kr-chevron-container-left { left: 0; }
  .kr-chevron-container-right { right: 0; }
  #page { position: absolute; top: 80px; left: 200px; right: 200px;
          font-size: 64px; line-height: 1.6; }
  ion-alert { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; z-index: 10; }
  ion-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); }
  .alert-wrapper { position: relative; background: #fff; padding: 24px; z-index: 11; }
</style>

<!-- 位置同期モーダル。全面のバックドロップを伴い、出ている間はキー入力を吸う。 -->
<ion-alert id="sync-alert">
  <ion-backdrop></ion-backdrop>
  <div class="alert-wrapper">
    <div>前回読んでいたページ</div>
    <div>あなたは今<span id="cur-pos"></span>にいます。</div>
    <button class="alert-button" id="btn-no">いいえ</button>
    <button class="alert-button" id="btn-yes">はい</button>
  </div>
</ion-alert>

<div class="top-chrome"><span class="top-chrome__book-title">偽リーダー</span></div>
<div class="kr-chevron-container-left"></div>
<div class="kr-chevron-container-right"></div>
<div id="page"></div>
<div id="kr-scrubber-bar"></div>
<ion-footer class="reader-footer">
  <span class="footer-label position"></span>
</ion-footer>

<script>
  const params = new URLSearchParams(location.search);
  const total = parseInt(params.get("total") || "40", 10);
  // 読みかけの本を再現する（先頭から開かない）
  let pos = parseInt(params.get("start") || "27", 10);
  // 縦書き（右→左）を再現: ArrowLeft が前進、ArrowRight が後退
  const forward = params.get("forward") || "ArrowLeft";
  const backward = forward === "ArrowLeft" ? "ArrowRight" : "ArrowLeft";
  // キー入力を吸うモーダルが出ている間は動かない
  let modalOpen = params.get("modal") !== "0";

  function render() {
    document.getElementById("page").textContent = "ページ " + pos + " の本文";
    document.querySelector(".footer-label.position").textContent =
      pos + "/" + total + "ページ  ●  " + Math.round((pos / total) * 100) + "%";
    document.getElementById("cur-pos").textContent = pos;
    document.getElementById("sync-alert").style.display = modalOpen ? "flex" : "none";
  }

  function close() { modalOpen = false; render(); }
  document.getElementById("btn-no").addEventListener("click", close);
  document.getElementById("btn-yes").addEventListener("click", close);

  document.addEventListener("keydown", (e) => {
    if (modalOpen) return;  // バックドロップがキーを吸う
    if (e.key === forward && pos < total) pos += 1;
    else if (e.key === backward && pos > 1) pos -= 1;
    else return;
    render();
  });

  render();
</script>
